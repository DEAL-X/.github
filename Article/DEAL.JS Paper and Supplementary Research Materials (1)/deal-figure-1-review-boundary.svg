<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img"><title>DEAL as a reviewable artifact boundary, not an explanation of model internals</title><rect width="1200" height="400" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#8496A0"/></marker></defs><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="35" y="95" width="205" height="95" rx="7" fill="#EDF6F5" stroke="#01696F" stroke-width="1.8"/><text x="137.5" y="130" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">Human intent</text><text x="137.5" y="158" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">Task + constraints</text><rect x="275" y="95" width="205" height="95" rx="7" fill="#EDF6F5" stroke="#01696F" stroke-width="1.8"/><text x="377.5" y="130" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">AI proposal</text><text x="377.5" y="158" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">Generation remains fallible</text><rect x="515" y="95" width="270" height="95" rx="7" fill="#EDF6F5" stroke="#01696F" stroke-width="1.8"/><text x="650" y="130" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">DEAL source</text><text x="650" y="158" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">Shared review artifact</text><rect x="820" y="95" width="345" height="95" rx="7" fill="#EDF6F5" stroke="#01696F" stroke-width="1.8"/><text x="992.5" y="130" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">Target + execution</text><text x="992.5" y="158" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">JavaScript + declared host</text><path d="M240 143L275 143" fill="none" stroke="#8496A0" stroke-width="2" marker-end="url(#a)"/><path d="M480 143L515 143" fill="none" stroke="#8496A0" stroke-width="2" marker-end="url(#a)"/><path d="M785 143L820 143" fill="none" stroke="#8496A0" stroke-width="2" marker-end="url(#a)"/><text x="650" y="70" font-size="18" font-weight="600" text-anchor="middle" fill="#01696F">inspect / edit / approve</text><text x="991" y="70" font-size="18" font-weight="600" text-anchor="middle" fill="#01696F">compile → test → execute</text><path d="M650 190V260H137V190" fill="none" stroke="#8496A0" stroke-width="2" marker-end="url(#a)"/><text x="390" y="289" font-size="20" font-weight="600" text-anchor="middle" fill="#172A35">Human review closes the loop</text><text x="600" y="352" font-size="18" font-weight="400" text-anchor="middle" fill="#445B67">Proposed workflow: approval and test gates are not enforced by the current compiler.</text></g></svg>
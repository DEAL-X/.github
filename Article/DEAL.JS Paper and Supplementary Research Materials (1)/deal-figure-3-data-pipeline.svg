<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img"><title>Controlled research extraction pipeline and current evidence boundary</title><rect width="1200" height="410" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#8496A0"/></marker></defs><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="25" y="95" width="210" height="100" rx="7" fill="#EDF6F5" stroke="#01696F" stroke-width="1.8"/><text x="130" y="130" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">Retrieve</text><text x="130" y="158" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">API or page snapshot</text><rect x="260" y="95" width="210" height="100" rx="7" fill="#EDF6F5" stroke="#01696F" stroke-width="1.8"/><text x="365" y="130" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">Extract</text><text x="365" y="158" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">JSON fields / DOM rows</text><rect x="495" y="95" width="210" height="100" rx="7" fill="#EDF6F5" stroke="#01696F" stroke-width="1.8"/><text x="600" y="130" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">Normalize</text><text x="600" y="158" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">Unicode + schema</text><rect x="730" y="95" width="210" height="100" rx="7" fill="#EDF6F5" stroke="#01696F" stroke-width="1.8"/><text x="835" y="130" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">Validate</text><text x="835" y="158" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">Reject + deduplicate</text><rect x="965" y="95" width="210" height="100" rx="7" fill="#EDF6F5" stroke="#01696F" stroke-width="1.8"/><text x="1070" y="130" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">Store</text><text x="1070" y="158" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">JSONL + provenance</text><path d="M235 145L260 145" fill="none" stroke="#8496A0" stroke-width="2" marker-end="url(#a)"/><path d="M470 145L495 145" fill="none" stroke="#8496A0" stroke-width="2" marker-end="url(#a)"/><path d="M705 145L730 145" fill="none" stroke="#8496A0" stroke-width="2" marker-end="url(#a)"/><path d="M940 145L965 145" fill="none" stroke="#8496A0" stroke-width="2" marker-end="url(#a)"/><path d="M40 245H1160" fill="none" stroke="#8496A0" stroke-width="1"/><text x="600" y="283" font-size="20" font-weight="600" text-anchor="middle" fill="#172A35">Standalone JavaScript fixture: local Response → normalized records → JSONL; 17 assertions.</text><text x="600" y="326" font-size="18" font-weight="400" text-anchor="middle" fill="#445B67">DEAL scraper integration remains illustrative: host bindings and several library bodies are incomplete.</text><text x="600" y="366" font-size="18" font-weight="400" text-anchor="middle" fill="#445B67">Provenance contract: source identifier, retrieval time, content hash, schema and module versions.</text></g></svg>
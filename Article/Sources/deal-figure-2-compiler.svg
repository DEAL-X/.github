<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img"><title>Implemented DEAL.JS stage order and dependency side path</title><rect width="1200" height="460" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#8496A0"/></marker></defs><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="25" y="100" width="210" height="100" rx="7" fill="#EDF6F5" stroke="#01696F" stroke-width="1.8"/><text x="130" y="135" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">Tokenizer</text><text x="130" y="163" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">USE, RESERVE, casing</text><rect x="260" y="100" width="210" height="100" rx="7" fill="#EDF6F5" stroke="#01696F" stroke-width="1.8"/><text x="365" y="135" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">Preprocessor</text><text x="365" y="163" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">Configured token stage</text><rect x="495" y="100" width="210" height="100" rx="7" fill="#EDF6F5" stroke="#01696F" stroke-width="1.8"/><text x="600" y="135" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">Parser</text><text x="600" y="163" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">Tokens → flat nodes</text><rect x="730" y="100" width="210" height="100" rx="7" fill="#EDF6F5" stroke="#01696F" stroke-width="1.8"/><text x="835" y="135" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">Assembler</text><text x="835" y="163" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">Hierarchy + lowering</text><rect x="965" y="100" width="210" height="100" rx="7" fill="#EDF6F5" stroke="#01696F" stroke-width="1.8"/><text x="1070" y="135" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">Generator</text><text x="1070" y="163" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">JavaScript text</text><path d="M235 150L260 150" fill="none" stroke="#8496A0" stroke-width="2" marker-end="url(#a)"/><path d="M470 150L495 150" fill="none" stroke="#8496A0" stroke-width="2" marker-end="url(#a)"/><path d="M705 150L730 150" fill="none" stroke="#8496A0" stroke-width="2" marker-end="url(#a)"/><path d="M940 150L965 150" fill="none" stroke="#8496A0" stroke-width="2" marker-end="url(#a)"/><text x="130" y="62" font-size="18" font-weight="600" text-anchor="middle" fill="#172A35">Mixed DEAL + JS source</text><rect x="25" y="270" width="445" height="95" rx="7" fill="#EDF6F5" stroke="#01696F" stroke-width="1.8"/><text x="247.5" y="305" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">Module resources</text><text x="247.5" y="333" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">Compile; execute via configured stage</text><path d="M130 200V270M470 317H600V200" fill="none" stroke="#8496A0" stroke-width="2" marker-end="url(#a)"/><text x="845" y="294" font-size="17" font-weight="400" text-anchor="middle" fill="#445B67">Native .js source: content passthrough, outside this pipeline.</text><text x="845" y="326" font-size="17" font-weight="400" text-anchor="middle" fill="#445B67">Generated JavaScript executes through the configured host.</text><text x="600" y="414" font-size="18" font-weight="400" text-anchor="middle" fill="#445B67">Explicit declarations and mixed JavaScript source share the configured compilation pipeline.</text></g></svg>
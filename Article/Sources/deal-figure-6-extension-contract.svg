<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img"><title>Vocabulary adaptation and future backend portability contracts</title><rect width="1200" height="430" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#8496A0"/></marker></defs><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="40" y="65" width="300" height="95" rx="7" fill="#EDF6F5" stroke="#01696F" stroke-width="1.8"/><text x="190" y="100" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">Localized vocabulary</text><text x="190" y="128" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">Configurable aliases</text><rect x="445" y="65" width="310" height="95" rx="7" fill="#EDF6F5" stroke="#01696F" stroke-width="1.8"/><text x="600" y="100" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">Canonical DEAL core</text><text x="600" y="128" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">Stable structural meaning</text><rect x="860" y="65" width="300" height="95" rx="7" fill="#EDF6F5" stroke="#01696F" stroke-width="1.8"/><text x="1010" y="100" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">JavaScript backend</text><text x="1010" y="128" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">Current implementation</text><path d="M340 113L445 113" fill="none" stroke="#8496A0" stroke-width="2" marker-end="url(#a)"/><path d="M755 113L860 113" fill="none" stroke="#8496A0" stroke-width="2" marker-end="url(#a)"/><rect x="860" y="240" width="300" height="95" rx="7" fill="#FFFFFF" stroke="#01696F" stroke-width="1.8" stroke-dasharray="8 5"/><text x="1010" y="275" font-size="21" font-weight="600" text-anchor="middle" fill="#172A35">Additional backends</text><text x="1010" y="303" font-size="16" font-weight="400" text-anchor="middle" fill="#445B67">Proposed; not implemented</text><path d="M600 160V287H860" fill="none" stroke="#8496A0" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="40" y="265" font-size="19" font-weight="600" text-anchor="start" fill="#172A35">Required equivalence:</text><text x="40" y="300" font-size="18" font-weight="400" text-anchor="start" fill="#445B67">same task-observable behavior</text><text x="600" y="390" font-size="18" font-weight="400" text-anchor="middle" fill="#445B67">Solid: implemented mechanisms. Dashed: extension to additional target languages.</text></g></svg>